<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>doc-wrapper · markdown sync demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
    <style>
      .md-editor {
        width: 100%;
        min-height: 220px;
        padding: 10px 12px;
        background: var(--bg-input);
        font-family: "JetBrains Mono", monospace;
        font-size: 13px;
        line-height: 1.55;
        color: var(--ink);
        outline: none;
        white-space: pre-wrap;
        resize: vertical;
        border: 0;
      }
      .md-preview {
        padding: 10px 14px;
        font-family: ui-sans-serif, -apple-system, system-ui, sans-serif;
        font-size: 13px;
        color: var(--ink);
        border-top: 1px solid var(--hair);
        background: rgba(255,255,255,0.02);
      }
      .md-preview h1 { font-size: 18px; margin: 0.4em 0; font-weight: 600; }
      .md-preview h2 { font-size: 15px; margin: 0.4em 0; font-weight: 600; }
      .md-preview h3 { font-size: 14px; margin: 0.4em 0; font-weight: 600; }
      .md-preview p  { margin: 0.4em 0; }
      .md-preview ul, .md-preview ol { padding-left: 20px; margin: 0.4em 0; }
      .md-preview li { margin: 0.15em 0; }
      .md-preview blockquote {
        border-left: 2px solid var(--hair-strong);
        padding-left: 10px;
        color: var(--ink-soft);
        margin: 0.4em 0;
      }
      .md-preview code {
        background: rgba(0,0,0,0.3);
        padding: 1px 4px;
        border-radius: 3px;
        font-family: "JetBrains Mono", monospace;
        font-size: 12px;
      }
      .md-preview pre {
        background: rgba(0,0,0,0.3);
        padding: 8px 10px;
        border-radius: 4px;
        overflow: auto;
        margin: 0.4em 0;
      }
      .md-preview pre code { background: none; padding: 0; }
      .md-preview a { color: hsl(200, 70%, 70%); }
    </style>
  </head>
  <body>
    <header class="bar">
      <h1>
        doc-wrapper
        <span>markdown · sync via crdt · tree+peritext · crdt demo</span>
      </h1>
      <div class="actions">
        <span class="hint">type markdown · toggle online to gate sync</span>
        <button class="btn" id="add-peer">+ editor</button>
      </div>
    </header>

    <main id="peers" class="peers" aria-label="editors"></main>

    <template id="peer-template">
      <article class="peer" data-peer="?">
        <header class="peer-head">
          <span class="peer-stripe" aria-hidden="true"></span>
          <h2 class="peer-name">editor —</h2>
          <code class="peer-site">site:—</code>
          <span class="peer-spacer"></span>
          <label class="online-toggle" title="when offline, edits stay local and queue until reconnected">
            <input class="online-cb" type="checkbox" checked />
            <span class="online-label">online</span>
          </label>
          <span class="pending" hidden>0 pending</span>
          <button class="btn-icon btn-close" title="remove editor" aria-label="remove editor">✕</button>
        </header>

        <textarea class="md-editor" data-role="editor"
                  placeholder="type markdown…" spellcheck="false"></textarea>

        <div class="md-preview" data-role="preview"></div>

        <details class="peer-rows">
          <summary>
            <span class="rows-label">engine state (rendered tree)</span>
            <span class="rows-summary">(0)</span>
          </summary>
          <div class="rows-frame">
            <pre data-role="state-dump" style="margin:0;padding:8px;font-size:11px;color:var(--ink-soft);overflow:auto;max-height:240px"></pre>
          </div>
        </details>
      </article>
    </template>

    <script type="module" src="./rich.js"></script>
  </body>
</html>
