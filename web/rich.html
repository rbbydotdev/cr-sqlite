<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>doc-wrapper · markdown sync demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
    <style>
      .md-editor {
        width: 100%;
        min-height: 220px;
        padding: 10px 12px;
        background: var(--bg-input);
        font-family: "JetBrains Mono", monospace;
        font-size: 13px;
        line-height: 1.55;
        color: var(--ink);
        outline: none;
        white-space: pre-wrap;
        resize: vertical;
        border: 0;
      }
      .md-preview {
        padding: 10px 14px;
        font-family: ui-sans-serif, -apple-system, system-ui, sans-serif;
        font-size: 13px;
        color: var(--ink);
        border-top: 1px solid var(--hair);
        background: rgba(255,255,255,0.02);
      }
      .md-preview h1 { font-size: 18px; margin: 0.4em 0; font-weight: 600; }
      .md-preview h2 { font-size: 15px; margin: 0.4em 0; font-weight: 600; }
      .md-preview h3 { font-size: 14px; margin: 0.4em 0; font-weight: 600; }
      .md-preview p  { margin: 0.4em 0; }
      .md-preview ul, .md-preview ol { padding-left: 20px; margin: 0.4em 0; }
      .md-preview li { margin: 0.15em 0; }
      .md-preview blockquote {
        border-left: 2px solid var(--hair-strong);
        padding-left: 10px;
        color: var(--ink-soft);
        margin: 0.4em 0;
      }
      .md-preview code {
        background: rgba(0,0,0,0.3);
        padding: 1px 4px;
        border-radius: 3px;
        font-family: "JetBrains Mono", monospace;
        font-size: 12px;
      }
      .md-preview pre {
        background: rgba(0,0,0,0.3);
        padding: 8px 10px;
        border-radius: 4px;
        overflow: auto;
        margin: 0.4em 0;
      }
      .md-preview pre code { background: none; padding: 0; }
      .md-preview a { color: hsl(200, 70%, 70%); }

      /* history scrubber */
      #history {
        margin: 14px 16px 24px;
        background: var(--bg-card);
        border: 1px solid var(--hair);
        border-radius: var(--r);
      }
      #history > header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 12px;
        border-bottom: 1px solid var(--hair);
        background: var(--bg-soft);
        font-size: 12px;
      }
      #history > header .spacer { flex: 1; }
      #history fieldset.speed {
        display: inline-flex;
        gap: 8px;
        border: 1px solid var(--hair);
        border-radius: 4px;
        padding: 2px 8px;
        font-size: 11px;
      }
      #history fieldset.speed legend {
        padding: 0 4px;
        color: var(--ink-mute);
        font-size: 10px;
      }
      #history fieldset.speed label {
        display: inline-flex;
        gap: 3px;
        align-items: center;
        color: var(--ink-soft);
        cursor: pointer;
      }
      #history fieldset.speed input { accent-color: hsl(200, 70%, 60%); }
      #history button.btn {
        padding: 3px 10px;
        background: var(--bg-input);
        border: 1px solid var(--hair);
        border-radius: 4px;
        color: var(--ink);
        font-size: 11px;
      }
      #history button.btn:hover { border-color: var(--ink-soft); }
      #history button.btn.active { background: hsl(200, 50%, 25%); border-color: hsl(200, 70%, 60%); }
      #history .history-frame {
        max-height: 260px;
        overflow: auto;
      }
      #history table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
      }
      #history th, #history td {
        text-align: left;
        padding: 4px 8px;
        border-bottom: 1px solid var(--hair);
      }
      #history th {
        position: sticky;
        top: 0;
        background: var(--bg-soft);
        color: var(--ink-soft);
        font-weight: 500;
      }
      #history td.c-idx     { width: 50px; color: var(--ink-mute); font-variant-numeric: tabular-nums; }
      #history td.c-when    { width: 70px; color: var(--ink-mute); font-variant-numeric: tabular-nums; }
      #history td.c-peer    { width: 60px; }
      #history td.c-source  { width: 80px; color: var(--ink-soft); }
      #history td.c-desc    { color: var(--ink); word-break: break-word; }
      #history tbody tr { cursor: pointer; }
      #history tbody tr:hover { background: rgba(255,255,255,0.03); }
      #history tbody tr.current { background: hsl(200, 40%, 20%); }
      #history tbody tr.played  { color: var(--ink-mute); }
      #history .peer-chip {
        display: inline-block;
        padding: 1px 6px;
        border-radius: 3px;
        font-size: 10px;
        font-weight: 600;
        color: var(--ink);
      }
      .scrubbing #peers .md-editor { background: rgba(0,0,0,0.4); pointer-events: none; }
      .scrubbing #peers .md-editor::after { content: "scrubbing — click 'live' to resume"; }
    </style>
  </head>
  <body>
    <header class="bar">
      <h1>
        doc-wrapper
        <span>markdown · sync via crdt · tree+peritext · crdt demo</span>
      </h1>
      <div class="actions">
        <span class="hint">type markdown · toggle online to gate sync</span>
        <button class="btn" id="add-peer">+ editor</button>
      </div>
    </header>

    <main id="peers" class="peers" aria-label="editors"></main>

    <section id="history" aria-label="change history">
      <header>
        <strong>history</strong>
        <span class="hint">every change · click any row to scrub · ▶ to play</span>
        <span class="spacer"></span>
        <fieldset class="speed">
          <legend>delay</legend>
          <label><input type="radio" name="speed" value="250">  250ms</label>
          <label><input type="radio" name="speed" value="500" checked>500ms</label>
          <label><input type="radio" name="speed" value="1000"> 1s</label>
          <label><input type="radio" name="speed" value="2000"> 2s</label>
        </fieldset>
        <button class="btn" id="hist-reset" title="jump to start">⏮</button>
        <button class="btn" id="hist-prev"  title="step back">◀</button>
        <button class="btn" id="hist-play"  title="play / pause">▶</button>
        <button class="btn" id="hist-next"  title="step forward">▶|</button>
        <button class="btn" id="hist-live"  title="back to live">live</button>
        <button class="btn" id="hist-copy"  title="copy event log as JSON">copy</button>
        <button class="btn" id="hist-clear" title="clear history">clear</button>
      </header>
      <div class="history-frame">
        <table id="history-table">
          <thead>
            <tr>
              <th class="c-idx">#</th>
              <th class="c-when">t</th>
              <th class="c-peer">peer</th>
              <th class="c-source">source</th>
              <th class="c-desc">change</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <template id="peer-template">
      <article class="peer" data-peer="?">
        <header class="peer-head">
          <span class="peer-stripe" aria-hidden="true"></span>
          <h2 class="peer-name">editor —</h2>
          <code class="peer-site">site:—</code>
          <span class="peer-spacer"></span>
          <label class="online-toggle" title="when offline, edits stay local and queue until reconnected">
            <input class="online-cb" type="checkbox" checked />
            <span class="online-label">online</span>
          </label>
          <span class="pending" hidden>0 pending</span>
          <button class="btn-icon btn-close" title="remove editor" aria-label="remove editor">✕</button>
        </header>

        <textarea class="md-editor" data-role="editor"
                  placeholder="type markdown…" spellcheck="false"></textarea>

        <div class="md-preview" data-role="preview"></div>

        <details class="peer-rows">
          <summary>
            <span class="rows-label">engine state (rendered tree)</span>
            <span class="rows-summary">(0)</span>
          </summary>
          <div class="rows-frame">
            <pre data-role="state-dump" style="margin:0;padding:8px;font-size:11px;color:var(--ink-soft);overflow:auto;max-height:240px"></pre>
          </div>
        </details>
      </article>
    </template>

    <script type="module" src="./rich.js"></script>
  </body>
</html>
