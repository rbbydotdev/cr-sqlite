[package]
name = "crsql_bundle"
version = "0.1.0"
edition = "2021"
authors = ["Matt Wonlaw"]
keywords = ["sqlite", "cr-sqlite"]
license = "Apache 2"

[lib]
name = "crsql_bundle"
crate-type = ["rlib"]

# "cdylib" <-- only enable cdylib if loadable_extension is enabled

[dependencies]
crsql_fractindex_core = {path="../fractindex-core"}
crsql_text_crdt_fugue = {path="../text-crdt-fugue"}
crsql_tree_crdt_kleppmann = {path="../tree-crdt-kleppmann"}
crsql_peritext_marks = {path="../peritext-marks"}
crsql_doc_wrapper = {path="../doc-wrapper"}
crsql_core = { path="../core" }
sqlite_nostd = { path="../sqlite-rs-embedded/sqlite_nostd" }
libc-print = "*"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[features]
test = ["crsql_core/test"]
libsql = ["crsql_core/libsql"]
loadable_extension = [
  "sqlite_nostd/loadable_extension",
  "crsql_fractindex_core/loadable_extension",
  "crsql_text_crdt_fugue/loadable_extension",
  "crsql_tree_crdt_kleppmann/loadable_extension",
  "crsql_peritext_marks/loadable_extension",
  "crsql_doc_wrapper/loadable_extension",
  "crsql_core/loadable_extension"
]
static = [
  "sqlite_nostd/static",
  "crsql_fractindex_core/static",
  "crsql_text_crdt_fugue/static",
  "crsql_tree_crdt_kleppmann/static",
  "crsql_peritext_marks/static",
  "crsql_doc_wrapper/static",
  "crsql_core/static"
]
omit_load_extension = [
  "sqlite_nostd/omit_load_extension",
  "crsql_fractindex_core/omit_load_extension",
  "crsql_text_crdt_fugue/omit_load_extension",
  "crsql_tree_crdt_kleppmann/omit_load_extension",
  "crsql_peritext_marks/omit_load_extension",
  "crsql_doc_wrapper/omit_load_extension",
  "crsql_core/omit_load_extension"
]
# Forwards the text-CRDT crate's `debug-monitor` feature. Adds the
# `crsql_fugue_install_monitor()` SQL UDF (an FFI hook into
# sqlite3_preupdate_hook). Off by default.
debug-monitor = ["crsql_text_crdt_fugue/debug-monitor"]
