\* TLC configuration for FugueOnCRSqlite.
\*
\* Three peers is the smallest interesting model: it exercises concurrent
\* edits and three-way delivery interleavings. MaxOps caps the state space
\* so TLC actually terminates on a laptop.
\*
\* If TLC reports "too many distinct states" lower MaxOps to 2. If you
\* want a deeper check, raise it to 4 or 5 and run overnight.

SPECIFICATION Spec

CONSTANTS
    Peers   = {p1, p2}
    MaxOps  = 2

\* Larger bounds (MaxOps=3, 3 peers) explode the state space —
\* MaxOps=3 hit 1.5M states at depth 6 in 3min without violations
\* but didn't terminate. Scale up for overnight runs only.

\* Safety properties (checked at every reachable state).
INVARIANTS
    TypeOK
    AtomicityInvariant
    StrongConvergence
    NoOrphanReads
    QuiescentAgreement

\* Temporal properties.
\* TombstoneMonotonicityProp: once tombstoned, never un-tombstoned.
\* EventualConsistency: once operations stop, peers converge.
PROPERTIES
    TombstoneMonotonicityProp
    EventualConsistency
