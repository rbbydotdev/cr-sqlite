<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>sqlite-crdt browser benchmarks</title>
  <style>
    body { font: 14px/1.45 -apple-system, system-ui, sans-serif; padding: 24px; max-width: 920px; }
    h1 { font-size: 18px; margin: 0 0 12px; }
    h2 { font-size: 14px; margin: 16px 0 4px; color: #555; }
    pre { background: #f5f5f5; padding: 8px; border-radius: 4px; overflow-x: auto; }
    table { border-collapse: collapse; margin: 8px 0; }
    th, td { padding: 4px 12px; text-align: left; border-bottom: 1px solid #eee; }
    th { background: #f9f9f9; }
    .ok { color: #1a7f37; }
    .err { color: #cf222e; }
    button { padding: 6px 14px; font-size: 14px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>sqlite-crdt browser benchmarks</h1>
  <p>Loads the fork-built <code>crsqlite.wasm</code> and runs the same scenarios as our native smoke tests, plus throughput benchmarks.</p>
  <p>
    <button id="run">Run benchmarks</button>
    <span id="status"></span>
  </p>
  <div id="results"></div>
  <script type="module" src="./dist/benchmarks.js"></script>
</body>
</html>
